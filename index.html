<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="A letter written only for you. Happy birthday.">
  <meta property="og:title" content="Happy Birthday, Sister">
  <meta property="og:description" content="A letter written only for you.">
  <meta itemprop="name" content="Happy Birthday, Sister">
  <meta itemprop="description" content="A letter written only for you.">
  <title>Happy Birthday, Sister</title>
  <style>
    :root {
      --bg0: #14080c;
      --bg1: #3a1722;
      --ink: #3c291f;
      --muted: #8a6d5d;
      --rose: #9d3a4a;
      --rose-deep: #6d2433;
      --gold: #f0ddb8;
      --paper: #fbf6ef;
      --cream: #f6e4d6;
      --line: rgba(90, 52, 36, 0.1);
      --vh: 1vh;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg0);
      color: var(--gold);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      min-height: calc(var(--vh) * 100);
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    button, a { font-family: inherit; }

    button {
      cursor: pointer;
      border: 0;
      background: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    :focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      height: calc(var(--vh) * 100);
      margin: 0 auto;
      overflow: hidden;
      background: #10080b;
    }

    .wash {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.1s ease;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(214, 126, 140, 0.28), transparent 52%),
        radial-gradient(ellipse at 80% 90%, rgba(120, 40, 58, 0.45), transparent 46%),
        linear-gradient(180deg, #4a2230 0%, var(--bg1) 38%, var(--bg0) 100%);
    }

    .stage:not([data-step="0"]) .wash { opacity: 1; }
    .stage[data-step="0"]::before { opacity: 0; }
    .stage[data-step="0"] .petals { opacity: 0; }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 244, 230, 0.16) 0.6px, transparent 0.7px);
      background-size: 3px 3px;
      opacity: 0.35;
      mask-image: linear-gradient(180deg, #000, transparent 85%);
    }

    .petals { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }

    .petal {
      position: absolute;
      top: -24px;
      width: 11px;
      height: 15px;
      background: radial-gradient(circle at 30% 30%, #ffe4ea, #d36a7a 55%, #9d3a4a);
      border-radius: 80% 10% 80% 10%;
      opacity: 0.75;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translate3d(0, -10vh, 0) rotate(0deg); }
      100% { transform: translate3d(var(--drift), 110vh, 0) rotate(360deg); }
    }

    .scene {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(16px + env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        calc(18px + env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px);
      transition: opacity 0.55s ease, transform 0.55s ease, visibility 0.55s;
    }

    .stage[data-scene="cover"] .scene-cover,
    .stage[data-scene="letter"] .scene-letter,
    .stage[data-scene="cake"] .scene-cake {
      opacity: 1;
      visibility: visible;
      transform: none;
    }

    .cover, .cake-wrap {
      width: min(100%, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .kicker {
      font-size: 12px;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      text-transform: uppercase;
      color: rgba(240, 221, 184, 0.82);
    }

    .name {
      margin-top: 14px;
      font-family: Palatino, "Palatino Linotype", "Iowan Old Style", "Times New Roman", "Songti SC", serif;
      font-size: clamp(48px, 16vw, 64px);
      font-weight: 500;
      line-height: 1;
      color: #fff8f1;
      text-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
    }

    .sub {
      margin: 10px 0 28px;
      font-family: Palatino, "Palatino Linotype", "Iowan Old Style", "Times New Roman", "Songti SC", serif;
      font-size: 16px;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .env-btn { position: relative; }

    .env-view, .envelope {
      width: min(286px, 78vw);
      height: auto;
      aspect-ratio: 286 / 188;
    }

    .envelope {
      position: relative;
      transform-style: preserve-3d;
      filter: drop-shadow(0 18px 24px rgba(40, 8, 16, 0.45));
    }

    .env-view { perspective: 900px; }

    .env-back, .env-pocket, .env-flap, .env-sheet {
      position: absolute;
    }

    .env-back {
      inset: 0;
      border-radius: 8px;
      background: linear-gradient(180deg, #e7b79a, #c98474);
    }

    .env-sheet {
      left: 18px;
      right: 18px;
      top: 28px;
      height: 112px;
      background: linear-gradient(180deg, #fffdf9, #f4ece3);
      border-radius: 2px;
      z-index: 1;
      transition: transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.15s;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      padding: 0 18px;
    }

    .env-sheet i {
      display: block;
      height: 6px;
      border-radius: 99px;
      background: rgba(90, 52, 36, 0.12);
    }

    .env-sheet i:nth-child(2) { width: 78%; }
    .env-sheet i:nth-child(3) { width: 54%; }

    .envelope.is-open .env-sheet { transform: translateY(-64px); }

    .env-flap {
      left: 0;
      right: 0;
      top: 0;
      height: 118px;
      background: linear-gradient(180deg, #fff1e4, #f0cbb6);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      z-index: 4;
      transition: transform 0.75s cubic-bezier(0.2, 0.7, 0.2, 1), z-index 0s linear 0.35s;
    }

    .envelope.is-open .env-flap {
      transform: rotateX(188deg);
      z-index: 0;
    }

    .env-pocket {
      inset: 0;
      z-index: 3;
      background: linear-gradient(165deg, #fff6ee 0%, #f3d5c4 48%, #e8bba8 100%);
      clip-path: polygon(0 42%, 50% 78%, 100% 42%, 100% 100%, 0 100%);
      border-radius: 0 0 8px 8px;
    }

    .env-pocket::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58%;
      background: linear-gradient(180deg, transparent, rgba(140, 70, 60, 0.08));
    }

    .seal {
      position: absolute;
      left: 50%;
      top: 58%;
      z-index: 5;
      width: 76px;
      height: 76px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #f8e7c9;
      font-family: Palatino, "Palatino Linotype", "Times New Roman", serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-indent: 0.08em;
      background: radial-gradient(circle at 35% 30%, #e87886, #8d2434 68%);
      box-shadow:
        inset 0 0 0 5px rgba(255, 226, 190, 0.45),
        inset 0 0 0 8px rgba(110, 24, 36, 0.35),
        0 10px 18px rgba(40, 8, 14, 0.28);
      transition: transform 0.45s ease, opacity 0.45s ease;
    }

    .seal::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(240, 221, 184, 0.65);
      animation: pulse 1.8s ease-out infinite;
    }

    .envelope.is-open .seal {
      opacity: 0;
      transform: translate(-50%, -40%) scale(0.3) rotate(18deg);
    }

    .envelope.is-open .seal::after { animation: none; opacity: 0; }

    @keyframes pulse {
      0% { transform: scale(0.92); opacity: 0.8; }
      100% { transform: scale(1.25); opacity: 0; }
    }

    .shadow {
      width: 210px;
      height: 18px;
      margin-top: 16px;
      background: radial-gradient(ellipse, rgba(0, 0, 0, 0.38), transparent 70%);
    }

    .hint { display: none; }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }

    .scene-cover,
    .scene-cake {
      padding-bottom: calc(92px + env(safe-area-inset-bottom));
    }

    .scene-letter {
      background: #f4f3f1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: calc(64px + env(safe-area-inset-top)) 22px calc(108px + env(safe-area-inset-bottom));
    }

    .after-wish {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: calc(72px + env(safe-area-inset-top)) 28px calc(36px + env(safe-area-inset-bottom));
      background: #f4f3f1;
      text-align: center;
    }

    .after-wish[hidden] { display: none; }

    .after-wish .text-btn { color: #8a847c; }

    .quote-board {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }

    .zh {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 0;
      color: #1c1c1c;
      font-family: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif SC", "SimSun", serif;
      font-size: clamp(17px, 4.8vw, 21px);
      line-height: 2;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .zh span { display: block; }

    .zh .break { height: 0.9em; }

    .quiet {
      margin-top: 4px;
      min-height: 44px;
      padding: 10px 16px;
      color: #9a958e;
      font-size: 13px;
      letter-spacing: 0.32em;
      text-indent: 0.32em;
    }

    .btn {
      min-width: 168px;
      min-height: 48px;
      padding: 13px 26px;
      border-radius: 999px;
      background: linear-gradient(180deg, #b24a5b, var(--rose-deep));
      color: #fff8f3;
      letter-spacing: 0.22em;
      text-indent: 0.22em;
      font-size: 15px;
      box-shadow: 0 10px 24px rgba(90, 20, 34, 0.35);
    }

    .btn:active { transform: translateY(1px); }

.text-btn {
  display: block;
  margin-top: 12px;
  padding: 6px 10px;
  color: rgba(240, 221, 184, 0.8);
  letter-spacing: 0.08em;
  font-size: 13px;
  text-decoration: underline;
  text-underline-offset: 4px;
}

.text-btn[hidden] {
  display: none;
}

    .cake-wrap h2 {
      font-family: Palatino, "Palatino Linotype", "Iowan Old Style", "Times New Roman", serif;
      font-weight: 500;
      font-size: 32px;
      letter-spacing: 0.04em;
      color: #fff8f1;
    }

    .cake-lead {
      margin: 8px 0 26px;
      color: rgba(240, 221, 184, 0.86);
      letter-spacing: 0.08em;
      font-size: 14px;
    }

    .cake {
      position: relative;
      width: 230px;
      height: 210px;
      margin-bottom: 26px;
    }

    .glow {
      position: absolute;
      left: 50%;
      top: 36px;
      width: 140px;
      height: 80px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(255, 186, 92, 0.55), transparent 70%);
      filter: blur(2px);
      transition: opacity 0.5s ease;
    }

    .candles {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      display: flex;
      gap: 22px;
      z-index: 3;
    }

    .candle {
      position: relative;
      width: 8px;
      height: 48px;
      border-radius: 3px;
      background: linear-gradient(90deg, #f3ddb0, #e7c98a 45%, #c9a45e);
    }

    .flame {
      position: absolute;
      left: 50%;
      bottom: 44px;
      width: 14px;
      height: 22px;
      transform: translateX(-50%);
      background: radial-gradient(circle at 50% 72%, #fff6d2 0 3px, #ffc15a 6px, #ff6a3d 12px, transparent 14px);
      border-radius: 50% 50% 45% 45%;
      animation: flicker 0.28s infinite alternate;
      transform-origin: center bottom;
    }

    .flame::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 8px;
      width: 5px;
      height: 9px;
      transform: translateX(-50%);
      background: #fff8e4;
      border-radius: 50%;
      opacity: 0.9;
    }

    @keyframes flicker {
      from { transform: translateX(-50%) scale(1) rotate(-3deg); }
      to { transform: translateX(-50%) scale(0.86, 1.08) rotate(3deg); }
    }

    .cake.is-blown .flame {
      animation: none;
      opacity: 0;
      transform: translateX(-50%) scale(0.2);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .cake.is-blown .glow { opacity: 0; }

    .smoke {
      position: absolute;
      left: 50%;
      top: 8px;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      opacity: 0;
    }

    .cake.is-blown .smoke { animation: puff 1s ease forwards; }
    .cake.is-blown .smoke:nth-child(2) { animation-delay: 0.08s; }
    .cake.is-blown .smoke:nth-child(3) { animation-delay: 0.16s; }

    @keyframes puff {
      0% { opacity: 0.55; transform: translateY(0) scale(0.5); }
      100% { opacity: 0; transform: translateY(-36px) scale(1.8); }
    }

    .frost {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 78px;
      height: 42px;
      border-radius: 46px 46px 18px 18px;
      background: linear-gradient(180deg, #fffdfb, #f6e3e4);
      z-index: 2;
      box-shadow: inset 0 -8px 0 rgba(232, 180, 186, 0.45);
    }

    .frost span {
      position: absolute;
      top: 12px;
      width: 16px;
      height: 16px;
      border-radius: 50% 50% 50% 0;
      background: radial-gradient(circle at 35% 35%, #ff8d9b, #c43b52);
      transform: rotate(-40deg);
    }

    .frost span:nth-child(1) { left: 28px; }
    .frost span:nth-child(2) { left: 50%; margin-left: -8px; }
    .frost span:nth-child(3) { right: 28px; }

    .sponge {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 108px;
      height: 72px;
      border-radius: 6px 6px 18px 18px;
      background:
        repeating-linear-gradient(90deg, transparent, transparent 16px, rgba(255, 255, 255, 0.13) 17px, transparent 18px),
        linear-gradient(180deg, #f0b5a4, #d9837a 55%, #c96b6d);
    }

    .plate {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 40%, #fff, #e7d3c4 70%);
      box-shadow: 0 10px 16px rgba(0, 0, 0, 0.2);
    }

.wish {
  max-height: 0;
  margin-bottom: 0;
  overflow: hidden;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.5s ease 0.15s, transform 0.5s ease 0.15s, max-height 0.45s ease;
}

    .wish strong {
      display: block;
      margin-bottom: 8px;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 26px;
      font-weight: 500;
      color: #fff8f1;
    }

    .wish p {
      color: rgba(255, 244, 232, 0.9);
      line-height: 1.8;
      font-size: 15px;
    }

.cake-wrap.is-blown .wish {
  max-height: 160px;
  margin: 4px 0 18px;
  opacity: 1;
  transform: none;
}

    .cake-wrap.is-blown .blow { display: none; }

    .bgm {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }

    .confetti {
      position: fixed;
      top: -12px;
      z-index: 6;
      width: 8px;
      height: 12px;
      border-radius: 2px;
      pointer-events: none;
      animation: drop linear forwards;
    }

    @keyframes drop {
      to { transform: translate3d(var(--x), 105vh, 0) rotate(540deg); opacity: 0.2; }
    }

    .quiet, #blowBtn { display: none; }

    .lights {
      position: absolute;
      z-index: 4;
      top: calc(18px + env(safe-area-inset-top));
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 22px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .stage:not([data-step="0"]) .lights { opacity: 1; }

    .stage[data-scene="letter"] .lights,
    .stage[data-scene="cake"] .lights,
    .stage.is-after .lights { opacity: 0; }

    .lights i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff8ec, #f0c27a 42%, #c45c6a 78%);
      box-shadow: 0 0 16px 5px rgba(255, 196, 140, 0.55);
    }

    .balloons {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .stage[data-scene="letter"] .balloons,
    .stage[data-scene="cake"] .balloons,
    .stage.is-after .balloons { opacity: 0; }

    .balloon {
      position: absolute;
      bottom: -28%;
      width: 44px;
      height: 56px;
      border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;
      opacity: 0;
    }

    .balloon::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -5px;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      background: inherit;
      clip-path: polygon(50% 100%, 0 0, 100% 0);
    }

    .balloon::after {
      content: "";
      position: absolute;
      left: 50%;
      top: calc(100% + 4px);
      width: 1px;
      height: 48px;
      background: rgba(240, 214, 180, 0.72);
    }

    .balloons.is-up .balloon {
      animation: float-up 2.8s ease forwards, sway 5.6s ease-in-out infinite;
    }

    @keyframes float-up {
      to { bottom: var(--h); opacity: 0.94; }
    }

    @keyframes sway {
      0%, 100% { margin-left: 0; }
      50% { margin-left: 12px; }
    }

    .dock {
      position: absolute;
      z-index: 7;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      min-width: 176px;
      min-height: 48px;
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(180deg, #b24a5b, var(--rose-deep));
      color: #fff8f3;
      letter-spacing: 0.06em;
      text-indent: 0.06em;
      font-size: 14px;
      white-space: nowrap;
      box-shadow: 0 10px 24px rgba(40, 8, 14, 0.35);
    }

    .dock[hidden] { display: none; }

    @media (max-height: 720px) {
      .scene-letter { padding-top: calc(56px + env(safe-area-inset-top)); }
      .zh { font-size: 18px; line-height: 2; }
      .quote-board { gap: 24px; }
    }

    @media (max-width: 360px) {
      .name { font-size: 54px; }
      .env-view, .envelope { width: 250px; height: 168px; }
      .scene-letter { padding-left: 16px; padding-right: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" data-scene="intro" data-step="0">
    <div class="wash"></div>
    <div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="balloons" id="balloons"></div>
    <div class="petals" id="petals"></div>
    <audio class="bgm" id="bgm" src="hbd.mp3" loop preload="auto" playsinline></audio>

    <section class="scene scene-cover" aria-label="The sealed letter">
      <div class="cover">
        <p class="kicker">Only for you</p>
        <h1 class="name">Sister</h1>
        <p class="sub">Happy Birthday</p>
        <button class="env-btn" id="openBtn" type="button" aria-label="Open this letter">
          <div class="env-view">
            <div class="envelope" id="envelope">
              <div class="env-back"></div>
              <div class="env-sheet" aria-hidden="true"><i></i><i></i><i></i></div>
              <div class="env-flap"></div>
              <div class="env-pocket"></div>
              <div class="seal">Open</div>
            </div>
          </div>
          <div class="shadow"></div>
        </button>
        <p class="hint">Tap to open</p>
      </div>
    </section>

    <section class="scene scene-letter" aria-label="Birthday wishes">
      <div class="quote-board">
        <p class="zh" id="poem">
          <span>前路漫漫，人生待君奔赴</span>
          <span>愿希望、荣光、挚爱</span>
          <span>与无瑕的壮志为你引路</span>
          <span>愿你的灵魂永无惶惧</span>
          <span class="break"></span>
          <span>当下之所以珍贵，只因它转瞬更迭</span>
          <span>而未来，全然属于你</span>
        </p>
        <button class="quiet" id="wishBtn" type="button">Make a Wish</button>
      </div>
    </section>

    <section class="scene scene-cake" aria-label="Birthday cake">
      <div class="cake-wrap" id="cakeWrap">
        <h2 id="cakeTitle">Make a Wish</h2>
        <p class="cake-lead" id="cakeLead">The candles are lit.</p>
        <div class="cake" id="cake">
          <div class="glow"></div>
          <div class="candles" aria-hidden="true">
            <div class="candle"><i class="smoke"></i><b class="flame"></b></div>
            <div class="candle"><i class="smoke"></i><b class="flame"></b></div>
            <div class="candle"><i class="smoke"></i><b class="flame"></b></div>
          </div>
          <div class="frost"><span></span><span></span><span></span></div>
          <div class="sponge"></div>
          <div class="plate"></div>
        </div>
        <button class="btn blow" id="blowBtn" type="button">Blow Out the Candles</button>
      </div>
      <div class="after-wish" id="afterWish" hidden>
        <p class="zh">
          <span>但你的永恒之夏不会凋零</span>
          <span>你所拥有的美好风姿永不消逝</span>
        </p>
        <div>
          <button class="text-btn" id="againBtn" type="button">Read it again</button>
          <button class="text-btn" id="resetBtn" type="button">Seal the letter</button>
        </div>
      </div>
    </section>
    <button class="dock" id="dock" type="button">Turn On the Lights</button>
  </div>

  <script>
    (function lockWeChatFont() {
      function handle() {
        if (!window.WeixinJSBridge) return;
        WeixinJSBridge.invoke("setFontSizeCallback", { fontSize: 0 });
        WeixinJSBridge.on("menu:setfont", function () {
          WeixinJSBridge.invoke("setFontSizeCallback", { fontSize: 0 });
        });
      }
      if (typeof WeixinJSBridge === "object" && WeixinJSBridge.invoke) handle();
      else document.addEventListener("WeixinJSBridgeReady", handle, false);
    })();

    function setVH() {
      document.documentElement.style.setProperty("--vh", window.innerHeight * 0.01 + "px");
    }
    setVH();
    window.addEventListener("resize", setVH);

    var petals = document.getElementById("petals");
    for (var i = 0; i < 16; i++) {
      var petal = document.createElement("i");
      petal.className = "petal";
      petal.style.left = Math.random() * 100 + "%";
      petal.style.animationDuration = 7 + Math.random() * 8 + "s";
      petal.style.animationDelay = -Math.random() * 12 + "s";
      petal.style.setProperty("--drift", (Math.random() * 80 - 40) + "px");
      petal.style.opacity = 0.35 + Math.random() * 0.45;
      petal.style.transform = "scale(" + (0.7 + Math.random() * 0.8) + ")";
      petals.appendChild(petal);
    }

    var stage = document.getElementById("stage");
    var envelope = document.getElementById("envelope");
    var cakeWrap = document.getElementById("cakeWrap");
    var cake = document.getElementById("cake");
    var againBtn = document.getElementById("againBtn");
    var resetBtn = document.getElementById("resetBtn");
    var opened = false;
    var opening = false;
    var bgm = document.getElementById("bgm");

    function setScene(name) {
      stage.setAttribute("data-scene", name);
      var dock = document.getElementById("dock");
      if (name === "cover") dock.textContent = "Open the Letter";
      if (name === "letter") dock.textContent = "Make a Wish";
      if (name === "cake") dock.textContent = "Blow Out the Candles";
      dock.hidden = false;
    }

    function playBirthday() {
      var pending = bgm.play();
      if (pending && pending.catch) pending.catch(function () {});
    }

    function stopSong() {
      bgm.pause();
      try { bgm.currentTime = 0; } catch (err) {}
    }

    function burst() {
      var colors = ["#f2c1c8", "#c44558", "#f0ddb8", "#fffaf4", "#e39a8c"];
      for (var n = 0; n < 36; n++) {
        var bit = document.createElement("i");
        bit.className = "confetti";
        bit.style.left = 20 + Math.random() * 60 + "%";
        bit.style.background = colors[n % colors.length];
        bit.style.animationDuration = 1.6 + Math.random() * 1.3 + "s";
        bit.style.animationDelay = Math.random() * 0.15 + "s";
        bit.style.setProperty("--x", (Math.random() * 180 - 90) + "px");
        document.body.appendChild(bit);
        setTimeout(function (node) { node.remove(); }, 3200, bit);
      }
    }

    var balloonBox = document.getElementById("balloons");
    var balloonColors = ["#f4c9d0", "#f6e3d4", "#e7b3bc", "#f8efe6", "#d98996", "#f0d3b0", "#c96b78"];
    for (var b = 0; b < balloonColors.length; b++) {
      var balloon = document.createElement("i");
      balloon.className = "balloon";
      balloon.style.left = (6 + b * 13) + "%";
      balloon.style.setProperty("--h", (34 + (b % 3) * 8) + "%");
      balloon.style.background = "radial-gradient(circle at 32% 28%, #fffaf4, " + balloonColors[b] + " 64%)";
      balloon.style.animationDelay = (b * 0.12) + "s, " + (2.8 + b * 0.12) + "s";
      balloonBox.appendChild(balloon);
    }

    var dock = document.getElementById("dock");
    var step = 0;

    dock.addEventListener("click", function () {
      var scene = stage.getAttribute("data-scene");
      if (scene === "intro") {
        if (step === 0) {
          step = 1;
          stage.setAttribute("data-step", "1");
          dock.textContent = "Play the Music";
        } else if (step === 1) {
          step = 2;
          stage.setAttribute("data-step", "2");
          playBirthday();
          dock.textContent = "Raise the Balloons";
        } else if (step === 2) {
          step = 3;
          stage.setAttribute("data-step", "3");
          balloonBox.classList.add("is-up");
          dock.textContent = "Open the Card";
        } else {
          setScene("cover");
        }
        return;
      }
      if (scene === "cover") {
        document.getElementById("openBtn").click();
        return;
      }
      if (scene === "letter") {
        setScene("cake");
        return;
      }
      if (scene === "cake") {
        document.getElementById("blowBtn").click();
      }
    });

    document.getElementById("openBtn").addEventListener("click", function () {
      if (opened || opening) return;
      opening = true;
      envelope.classList.add("is-open");
      burst();
      setTimeout(function () {
        opened = true;
        opening = false;
        setScene("letter");
      }, 980);
    });

    document.getElementById("wishBtn").addEventListener("click", function () {
      setScene("cake");
    });

    var afterWish = document.getElementById("afterWish");

    document.getElementById("blowBtn").addEventListener("click", function () {
      if (cake.classList.contains("is-blown")) return;
      cake.classList.add("is-blown");
      burst();
      setTimeout(function () {
        afterWish.hidden = false;
        stage.classList.add("is-after");
        dock.hidden = true;
      }, 700);
    });

    againBtn.addEventListener("click", function () {
      afterWish.hidden = true;
      stage.classList.remove("is-after");
      cake.classList.remove("is-blown");
      setScene("letter");
    });

    resetBtn.addEventListener("click", function () {
      opened = false;
      opening = false;
      envelope.classList.remove("is-open");
      cake.classList.remove("is-blown");
      afterWish.hidden = true;
      stage.classList.remove("is-after");
      balloonBox.classList.remove("is-up");
      stage.setAttribute("data-step", "0");
      step = 0;
      dock.hidden = false;
      dock.textContent = "Turn On the Lights";
      stopSong();
      setScene("intro");
    });
  </script>
</body>
</html>
